server:
  port: ${SERVER_PORT:8080}

spring:
  mqtt:
    username: ${MQTT_USERNAME:mqtt_user}
    password: ${MQTT_PASSWORD:changeme}
    url: ${MQTT_URL:tcp://localhost:1883}
    # pub/sub must use different clientIds
    subClientId: ${MQTT_SUB_CLIENT_ID:mqtt_java_sub_01}
    pubClientId: ${MQTT_PUB_CLIENT_ID:mqtt_java_pub_01}
    subTopic: ${MQTT_SUB_TOPICS:your/local/topic,kg/wd,kg/sd,kg/gg,kg/dg,camera/frames,kg/wsd,ID1OUT,ID2OUT,ID3OUT}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/mqtt?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&rewriteBatchedStatements=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/*Mapper.xml

logging:
  level:
    com.atguigu.mqtt: info
    com.atguigu.mqtt.service.impl.SensorDataAsyncService: warn
